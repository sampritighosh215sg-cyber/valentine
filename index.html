<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>For Baban ❤️</title>
    <style>
        body {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            background-color: #fce4ec; 
            font-family: 'Arial', sans-serif;
            overflow: hidden;
        }

        .container {
            text-align: center;
            background: white;
            padding: 40px;
            border-radius: 30px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.1);
            max-width: 400px;
            position: relative;
        }

        h1 {
            color: #d81b60;
            font-size: 1.8rem;
            margin: 20px 0 10px 0;
        }

        .date {
            color: #ad1457;
            font-size: 1.1rem;
            margin-bottom: 20px;
            font-weight: bold;
        }

        .buttons {
            display: flex;
            justify-content: center;
            gap: 20px;
            height: 60px; /* Space for the buttons */
            align-items: center;
        }

        button {
            padding: 12px 30px;
            font-size: 1rem;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            font-weight: bold;
            transition: all 0.2s ease;
        }

        #yesBtn {
            background-color: #ff4081;
            color: white;
        }

        #noBtn {
            background-color: #9e9e9e;
            color: white;
            position: absolute; /* Allows it to move freely */
        }

        #imageDisplay {
            width: 100%;
            border-radius: 15px;
            display: block;
        }
    </style>
</head>
<body>

    <div class="container">
        <img id="imageDisplay" src="https://media.tenor.com/9C3B-LhX5S8AAAAM/cute-cat.gif" alt="Cute GIF">
        
        <h1 id="question">Will you be my valentine Baban? Forever?</h1>
        <div class="date">08.04.2023</div>
        
        <div class="buttons">
            <button id="yesBtn">Yes</button>
            <button id="noBtn">No</button>
        </div>
    </div>

    <script>
        const yesBtn = document.getElementById('yesBtn');
        const noBtn = document.getElementById('noBtn');
        const question = document.getElementById('question');
        const imageDisplay = document.getElementById('imageDisplay');

        // Better "No" button logic
        noBtn.addEventListener('mouseover', () => {
            const maxX = window.innerWidth - noBtn.offsetWidth;
            const maxY = window.innerHeight - noBtn.offsetHeight;
            
            const newX = Math.random() * maxX;
            const newY = Math.random() * maxY;
            
            noBtn.style.left = `${newX}px`;
            noBtn.style.top = `${newY}px`;
        });

        yesBtn.addEventListener('click', () => {
            question.innerHTML = "I love you! ❤️";
            // Make sure your picture is named us.jpg in the same folder!
            imageDisplay.src = "us.jpg"; 
            noBtn.style.display = 'none';
            yesBtn.style.transform = "scale(1.3)";
            yesBtn.innerHTML = "Forever! 🥰";
        });
    </script>
</body>
</html>
